# pytest.ini
[pytest]
# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = test_cases

# 命令行选项
addopts = 
    -v
    -s
    --tb=short
    --alluredir=reports/allure-results
    --clean-alluredir
    --junitxml=reports/junit.xml

# 自定义标记（固定标记）
# 注意：case_id_* 标记由 conftest.py 动态注册，无需在此列出
markers =
    # ========== 测试类型 ==========
    smoke: 冒烟测试用例
    regression: 回归测试用例
    functional: 功能测试
    core_flow: 核心流程
    
    # ========== 优先级 ==========
    p0: 优先级P0（最高）
    p1: 优先级P1（高）
    p2: 优先级P2（中）
    p3: 优先级P3（低）
    
    # ========== 测试场景 ==========
    positive: 正向测试
    negative: 反向测试
    boundary: 边界值测试
    
    # ========== 安全测试 ==========
    security: 安全测试用例
    xss: XSS安全测试
    sql_injection: SQL注入测试
    
    # ========== 国际化/兼容性 ==========
    i18n: 国际化测试
    timezone: 时区测试
    compatibility: 兼容性测试
    browser: 浏览器兼容性测试
    responsive: 响应式测试
    mobile: 移动端测试
    accessibility: 可访问性测试
    
    # ========== UI 测试 ==========
    ui: UI交互测试
    navigation: 导航测试
    validation: 校验测试
    draft: 草稿测试
    
    # ========== 站点标记 ==========
    us: 美国站测试
    sg: 新加坡站测试
    ae: 阿联酋站测试
    au: 澳大利亚站测试
    
    # ========== 业务模块 ==========
    login: 登录模块测试
    register: 注册模块测试
    profile: 个人中心模块测试
    marketplace: Marketplace 模块测试
    purchase: 购买流程测试
    location_panel: 定位面板模块测试
    job_publish: 职位发布模块测试
    property_detail: 商业地产详情页测试
